<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binance Micro-Terminal</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root {
            --bg: #0b0e11;
            --panel: #151a21;
            --border: #2a323d;
            --text: #eaecef;
            --text-muted: #848e9c;
            --green: #0ecb81;
            --red: #f6465d;
            --blue: #3b82f6;
            --yellow: #f0b90b;
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: var(--font); display: flex; flex-direction: column; height: 100vh; overflow: hidden; font-size: 13px; }
        
        /* Header */
        #topbar { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: var(--panel); border-bottom: 1px solid var(--border); height: 50px; }
        .brand { font-weight: bold; font-size: 16px; color: var(--yellow); display: flex; align-items: center; gap: 10px; }
        .stats { display: flex; gap: 20px; font-size: 12px; }
        .stat { display: flex; flex-direction: column; align-items: flex-end; }
        .stat .lbl { color: var(--text-muted); font-size: 10px; text-transform: uppercase; }
        .stat .val { font-weight: bold; font-size: 14px; }
        .pos { color: var(--green); }
        .neg { color: var(--red); }
        
        /* Tabs */
        #tabsContainer { display: flex; background: var(--panel); border-bottom: 1px solid var(--border); overflow-x: auto; height: 35px; align-items: stretch; }
        .tab { padding: 0 15px; display: flex; align-items: center; gap: 8px; cursor: pointer; border-right: 1px solid var(--border); color: var(--text-muted); transition: 0.2s; font-size: 12px; }
        .tab:hover { background: rgba(255,255,255,0.05); }
        .tab.active { background: var(--bg); color: var(--text); border-top: 2px solid var(--yellow); }
        .close-btn { color: var(--text-muted); font-size: 16px; line-height: 1; cursor: pointer; margin-left: 5px; }
        .close-btn:hover { color: var(--red); }
        .tab-add-btn { background: none; border: none; color: var(--text-muted); font-size: 20px; padding: 0 15px; cursor: pointer; display: flex; align-items: center; }
        .tab-add-btn:hover { color: var(--text); }
        
        /* Layout */
        #main { display: flex; flex: 1; overflow: hidden; }
        
        /* Chart Area */
        #chartWrapper { flex: 1; position: relative; display: flex; flex-direction: column; }
        #chartHeader { position: absolute; top: 10px; left: 15px; z-index: 10; display: flex; align-items: baseline; gap: 15px; pointer-events: none; }
        #chartSymbolLabel { font-size: 20px; font-weight: bold; }
        #chartLivePrice { font-size: 18px; font-weight: bold; color: var(--text-muted); }
        
        #chart { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        #chartCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        /* BPS Overlay */
        #bpsOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; }
        .bps-label { position: absolute; right: 0; background: rgba(21, 26, 33, 0.8); padding: 2px 6px; font-size: 11px; font-weight: bold; border: 1px solid; border-right: none; transform: translateY(-50%); }
        #labelTP { color: var(--green); border-color: var(--green); display: none; }
        #labelSL { color: var(--red); border-color: var(--red); display: none; }
        
        /* Add Line Button */
        #addLineBtn { position: absolute; display: none; width: 24px; height: 24px; background: var(--yellow); color: black; border-radius: 50%; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; z-index: 20; pointer-events: auto; transform: translate(-50%, -50%); box-shadow: 0 2px 5px rgba(0,0,0,0.5); font-size: 16px; }
        #addLineBtn:hover { transform: translate(-50%, -50%) scale(1.1); }
        
        /* Right Sidebar */
        #sidebar { width: 300px; background: var(--panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; }
        
        /* Trading Panel */
        #tradePanel { padding: 15px; border-bottom: 1px solid var(--border); }
        .btn-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .trade-btn { flex: 1; padding: 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 14px; color: white; transition: 0.2s; }
        .trade-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .buy { background: var(--green); }
        .sell { background: var(--red); }
        .close { background: var(--text-muted); width: 100%; padding: 8px; }
        .buy:not(:disabled):hover { background: #0ba86b; }
        .sell:not(:disabled):hover { background: #d13a4d; }
        
        /* Position Info */
        #positionInfo { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 10px; margin-bottom: 15px; font-size: 12px; }
        .pos-row { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .pos-row:last-child { margin-bottom: 0; }
        .pos-row .lbl { color: var(--text-muted); }
        .pos-row .val { font-family: monospace; font-size: 13px; }
        
        /* Distances */
        #distances { display: flex; gap: 10px; margin-bottom: 15px; font-size: 11px; }
        .dist-box { flex: 1; background: var(--bg); border: 1px solid var(--border); padding: 5px; text-align: center; border-radius: 4px; }
        .dist-lbl { color: var(--text-muted); display: block; margin-bottom: 2px; }
        .dist-val { font-weight: bold; font-family: monospace; }
        #dispRR { text-align: center; font-size: 16px; font-weight: bold; padding: 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; margin-bottom: 15px; color: var(--yellow); }
        
        /* History */
        #historyPanel { flex: 1; overflow-y: auto; padding: 15px; }
        .history-title { font-size: 12px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 5px; }
        .history-item { display: flex; justify-content: space-between; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 12px; }
        .history-item > div { display: flex; flex-direction: column; gap: 2px; }
        .history-sub { color: var(--text-muted); font-size: 10px; }
        .pnl { font-weight: bold; font-family: monospace; }
        
        /* Controls Bar */
        #controls { display: flex; padding: 10px 15px; background: var(--panel); border-bottom: 1px solid var(--border); gap: 10px; align-items: center; }
        .tf-btn { background: none; border: 1px solid var(--border); color: var(--text-muted); padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .tf-btn:hover { background: rgba(255,255,255,0.05); }
        .tf-btn.active { background: var(--border); color: var(--text); }
        .spacer { flex: 1; }
        
        /* Indicators UI */
        .ind-btn { background: none; border: 1px solid var(--border); color: var(--text-muted); padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 5px; }
        .ind-btn.active { color: var(--yellow); border-color: var(--yellow); }
        .ind-menu { position: relative; }
        .ind-dropdown { position: absolute; top: 100%; right: 0; background: var(--panel); border: 1px solid var(--border); padding: 10px; border-radius: 4px; z-index: 100; display: none; min-width: 150px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .ind-dropdown.open { display: block; }
        .ind-dropdown label { display: block; margin-bottom: 5px; font-size: 12px; }
        .ind-dropdown input[type="number"] { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 4px; margin-bottom: 10px; }
        
        /* Settings Sidebar */
        #settingsSidebar { position: fixed; top: 0; right: -300px; width: 300px; height: 100vh; background: var(--panel); border-left: 1px solid var(--border); transition: right 0.3s; z-index: 1000; padding: 20px; display: flex; flex-direction: column; box-shadow: -5px 0 15px rgba(0,0,0,0.5); }
        #settingsSidebar.open { right: 0; }
        .settings-title { font-size: 16px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .setting-group { margin-bottom: 15px; }
        .setting-group label { display: block; margin-bottom: 5px; color: var(--text-muted); font-size: 12px; }
        .setting-group input { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px; border-radius: 4px; }
        
        /* Integrity Tag */
        #integrityTag { font-size: 10px; padding: 4px 8px; border: 1px solid var(--green); border-radius: 4px; color: var(--green); text-align: center; line-height: 1.2; }
        
        /* Debug Panel */
        #debugPanel { position: fixed; bottom: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 5px 10px; border-radius: 4px; font-family: monospace; font-size: 10px; color: var(--text-muted); display: flex; gap: 15px; z-index: 50; pointer-events: none; }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
    </style>
</head>
<body>

    <!-- Settings Sidebar -->
    <div id="settingsSidebar">
        <div class="settings-title">Settings</div>
        <div class="setting-group">
            <label>Capital (USDT)</label>
            <input type="number" id="setCapital" value="500" onchange="updateSettings()">
        </div>
        <div class="setting-group">
            <label>Position Size (%)</label>
            <input type="number" id="setPosPct" value="10" onchange="updateSettings()">
        </div>
        <div class="setting-group">
            <label>Max Open Positions</label>
            <input type="number" id="setMaxPos" value="3" onchange="updateSettings()">
        </div>
        <button class="trade-btn close" onclick="toggleMenu()" style="margin-top: auto;">Close Settings</button>
    </div>

    <!-- Top Bar -->
    <div id="topbar">
        <div class="brand">
            <span style="cursor: pointer;" onclick="toggleMenu()">☰</span> Binance Micro-Terminal
        </div>
        <div class="stats">
            <div class="stat">
                <span class="lbl">Balance</span>
                <span class="val" id="globalBalance">$500.00</span>
            </div>
            <div class="stat">
                <span class="lbl">uPnL</span>
                <span class="val" id="globalUpnl">+$0.00</span>
            </div>
            <div style="display: flex; align-items: center; margin-left: 10px;">
                <div id="integrityTag">Checking...</div>
            </div>
            <div style="display: flex; align-items: center; margin-left: 10px;">
                <button class="ind-btn" onclick="copyDebugLog()">📋 Debug Log</button>
            </div>
        </div>
    </div>

    <!-- Tabs -->
    <div id="tabsContainer"></div>

    <!-- Main Area -->
    <div id="main">
        <!-- Chart Area -->
        <div id="chartWrapper">
            <div id="controls">
                <button class="tf-btn active" data-tf="1m" onclick="setTimeframe('1m')">1m</button>
                <button class="tf-btn" data-tf="5m" onclick="setTimeframe('5m')">5m</button>
                <button class="tf-btn" data-tf="15m" onclick="setTimeframe('15m')">15m</button>
                <button class="tf-btn" data-tf="30m" onclick="setTimeframe('30m')">30m</button>
                <button class="tf-btn" data-tf="1h" onclick="setTimeframe('1h')">1h</button>
                <button class="tf-btn" data-tf="4h" onclick="setTimeframe('4h')">4h</button>
                <div class="spacer"></div>
                
                <button class="ind-btn" id="btnToggleMA" onclick="toggleIndicator('MA')">MA</button>
                
                <div class="ind-menu">
                    <button class="ind-btn" id="btnToggleVolume" onclick="toggleIndicator('Volume')">Vol</button>
                    <button class="ind-btn" onclick="toggleVolumeSettings(event)" style="padding: 4px;">⚙️</button>
                    <div class="ind-dropdown" id="volumeSettingsMenu">
                        <label><input type="checkbox" id="volShowMA" onchange="saveVolumeSettings()"> Show MA</label>
                        <label>MA Period</label>
                        <input type="number" id="volMAPeriod" value="20" onchange="saveVolumeSettings()">
                    </div>
                </div>
            </div>

            <div id="chartHeader">
                <div id="chartSymbolLabel">—</div>
                <div id="chartLivePrice">—</div>
            </div>
            
            <div id="chart"></div>
            <div id="chartCanvas">
                <div id="bpsOverlay">
                    <div id="labelTP" class="bps-label"></div>
                    <div id="labelSL" class="bps-label"></div>
                </div>
                <div id="addLineBtn">+</div>
            </div>
        </div>

        <!-- Sidebar -->
        <div id="sidebar">
            <div id="tradePanel">
                <div class="btn-group">
                    <button class="trade-btn buy" id="btnBuy" onclick="openPosition('buy')">Buy / Long</button>
                    <button class="trade-btn sell" id="btnSell" onclick="openPosition('sell')">Sell / Short</button>
                </div>
                <button class="trade-btn close" id="btnClose" onclick="closePosition('Manual')" disabled>Close Position</button>
            </div>
            
            <div style="padding: 15px; border-bottom: 1px solid var(--border);">
                <div id="positionInfo"></div>
                <div id="distances">
                    <div class="dist-box">
                        <span class="dist-lbl">TP Dist</span>
                        <span class="dist-val" id="dispTPDist" style="color:var(--green)">—</span>
                    </div>
                    <div class="dist-box">
                        <span class="dist-lbl">SL Dist</span>
                        <span class="dist-val" id="dispSLDist" style="color:var(--red)">—</span>
                    </div>
                </div>
                <div id="dispRR">R = —</div>
            </div>

            <div id="historyPanel">
                <div class="history-title">Trade History</div>
                <div id="historyList"></div>
            </div>
        </div>
    </div>

    <!-- Debug Panel -->
    <div id="debugPanel">
        <span>Load: <span id="dbgLoadTime">0.00s</span></span>
        <span>Graph: <span id="dbgFixTime">0.00s</span></span>
        <span>Batches: <span id="dbgBatches">0 / 0</span></span>
        <span>Candles: <span id="dbgCandles">0 / 0</span></span>
    </div>

    <!-- Scripts -->
    <script src="js/state.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/chart.js"></script>
    <script src="js/indicators.js"></script>
    <script src="js/trading.js"></script>
    <script src="js/tabs.js"></script>
    <script src="js/websocket.js"></script>
    <script src="js/main.js"></script>
    <script src="indicators/ma.js"></script>
    <script src="indicators/volume.js"></script>

</body>
</html>
