[project]
name = "binance-candle-service"
version = "1.0.0"
description = "Self-hosted Binance Spot candle synchronization service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "asyncpg>=0.29,<1",
  "httpx>=0.27,<1",
  "websockets>=13,<16",
  "pydantic-settings>=2.5,<3",
  "orjson>=3.10,<4",
]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2", "httpx>=0.27,<1", "ruff>=0.6,<1"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: integration tests (require running DB)",
]
[tool.ruff]
line-length = 100
target-version = "py312"