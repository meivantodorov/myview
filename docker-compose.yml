services:
  backend:
    build: ./services/fetcher
    container_name: binance_backend
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./services/fetcher/data:/app/data  # ТУК ЗАПАЗВАМЕ КЕША

  frontend:
    build: ./client
    container_name: binance_frontend
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      - backend