services:
  backend:
    build: ./services/fetcher
    container_name: binance_backend
    ports:
      - "8080:8080"
    restart: unless-stopped # Ако сървизът умре, Docker автоматично го вдига
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build: ./client
    container_name: binance_frontend
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      - backend